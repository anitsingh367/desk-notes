<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="1" stop-color="#ffe45c"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c938"/>
      <stop offset="1" stop-color="#fbe27a"/>
    </linearGradient>
    <radialGradient id="pinHead" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#d32f2f"/>
    </radialGradient>
  </defs>

  <!-- soft shadow -->
  <path d="M20 24 h88 a6 6 0 0 1 6 6 v58 l-28 28 h-66 a6 6 0 0 1 -6 -6 v-80 a6 6 0 0 1 6 -6z"
        fill="#000" opacity="0.18" transform="translate(2 4)"/>

  <!-- the note, slightly tilted -->
  <g transform="rotate(-4 64 64)">
    <path d="M18 20 h88 a6 6 0 0 1 6 6 v62 l-28 28 h-66 a6 6 0 0 1 -6 -6 v-84 a6 6 0 0 1 6 -6z"
          fill="url(#paper)"/>
    <!-- header strip -->
    <path d="M18 20 h88 a6 6 0 0 1 6 6 v10 h-100 v-10 a6 6 0 0 1 6 -6z" fill="#f5d94a"/>
    <!-- writing lines -->
    <g stroke="#c9a92a" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <line x1="28" y1="54" x2="96" y2="54"/>
      <line x1="28" y1="70" x2="90" y2="70"/>
      <line x1="28" y1="86" x2="74" y2="86"/>
    </g>
    <!-- folded corner -->
    <path d="M112 88 l-28 28 v-22 a6 6 0 0 1 6 -6z" fill="url(#fold)"/>
  </g>

  <!-- pin -->
  <line x1="66" y1="22" x2="62" y2="34" stroke="#7a7a7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="67" cy="16" r="10" fill="url(#pinHead)"/>
  <circle cx="64" cy="13" r="3" fill="#fff" opacity="0.6"/>
</svg>
